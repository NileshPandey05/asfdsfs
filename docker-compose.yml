version: '3.8'

services:
  backend:
    image: nileshpandey05/wind-forecast-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wind-forecast-backend
    ports:
      - "8000:8000"
    environment:
      - ELEXON_BASE_URL=https://data.elexon.co.uk/bmrs/api/v1
      - DEFAULT_CUTOFF_HOUR=11
      - DEFAULT_CUTOFF_MINUTE=0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    image: nileshpandey05/wind-forecast-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wind-forecast-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: wind-forecast-network
