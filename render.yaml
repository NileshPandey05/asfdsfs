services:
  - type: web
    name: wind-forecast-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ELEXON_BASE_URL
        value: https://data.elexon.co.uk/bmrs/api/v1
      - key: DEFAULT_CUTOFF_HOUR
        value: 11
      - key: DEFAULT_CUTOFF_MINUTE
        value: 0
    healthCheckPath: /api/health
